# Brief: configuration file for ZMK firmware
# Board: nice_nano_v2 and puchi_ble_v1
# =========================================
# on config_zmk.h file enable/disable the following options, if you want to
# use CONFIG_ZMK_MOUSE=y, CONFIG_ZMK_RGB_UNDERGLOW=y, CONFIG_ZMK_RGB_UNDERGLOW=y
# mouse config, 1 = enable, 0 = disable, default = 1
# 2 = enable, but with rgb matrix
# #define MC_TECHNOLOGY_MOUSE_ENABLE 1
# rgb matrix config, 1 = enable, 0 = disable, default = 0
# #define MC_TECHNOLOGY_RGB_ENABLE 0
# define macros on for .dtsi file 1 = enable, 0 = disable default = 1
# #define MC_TECHNOLOGY_MACROS_ENABLE 1

### Keyboard name
# CONFIG_ZMK_KEYBOARD_NAME="Nice sofle View"
# CONFIG_ZMK_KEYBOARD_NAME="Puchi sofle View"
# CONFIG_ZMK_KEYBOARD_NAME="Nice sofle Oled"
# CONFIG_ZMK_KEYBOARD_NAME="Puchi sofle Oled"

### Boost Bluetooth TX power, also make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# Tune bluetooth profiles for quick select
# CONFIG_BT_MAX_CONN=3
# Uncomment the following line if you facing issue on win 11 connection
# Enables a combination of settings that are planned to be default in future
# versions of ZMK to improve connection stability. This includes changes to
# timing on BLE pairing initiation, restores use of the updated/new LLCP
# implementation, and disables 2M PHY support.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

### POWER OPTIONS
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y

# Idle state timeout (ms). After this, peripherals such as lighting/display are disabled.
# Requested: battery idle timeout ~5 minutes.
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Deep sleep timeouts are optional; leaving defaults unless you explicitly want deep sleep behavior changed.
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Disable external power when not connected to USB (would shut peripherals off on battery immediately).
# Leave OFF to allow battery use with controlled timeouts instead.
# CONFIG_ZMK_EXT_POWER_USB_ONLY=y

### MOUSE
# https://github.com/zmkfirmware/zmk/blob/main/docs/docs/keymaps/behaviors/mouse-emulation.md
CONFIG_ZMK_MOUSE=y

### ZMK STUDIO
# https://github.com/zmkfirmware/zmk/blob/main/docs/docs/config/studio.md
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

### RGB UNDERGLOW (UNDERGLOW ONLY)
# Enable RGB Underglow support + Zephyr LED strip driver (WS2812)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Keep your preferred starting behavior (you can override later using Studio or &rgb_ug behaviors)
# 0 Solid, 1 Breathe, 2 Spectrum, 3 Swirl
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Brightness/effect defaults (optional). Uncomment if you want deterministic startup values.
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=240
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=10
# CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=15

# Battery-saving: turn off underglow when keyboard goes into idle state
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Optional: auto-off underglow when USB is disconnected (not required if AUTO_OFF_IDLE is enabled)
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# Optional: prevent toggling underglow from also toggling external power (can keep OLED from blanking when you toggle lights)
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

### OLED DISPLAY
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

### WIDGET SETTINGS
# CONFIG_ZMK_WIDGET_WPM_STATUS=n
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

### HID for nice!view/ePaper compatibility + general consumer HID
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Improves compatibility with iPad
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# NKRO options (left as-is / optional)
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y

### DEBUG OPTIONS
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

### ENABLE ENCODER
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
