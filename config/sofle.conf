# ============================================================
# Sofle configuration – stable build (no undefined Kconfig)
# ============================================================

### Bluetooth / radio
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

### Power / sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y

# NOTE: build.yaml is currently overriding this via -DCONFIG_ZMK_IDLE_TIMEOUT=...
# Keep it here for correctness, but you must fix build.yaml to make it take effect.
CONFIG_ZMK_IDLE_TIMEOUT=300000

### Pointing / mouse (required for encoder horizontal scroll behavior)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

### ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ============================================================
# RGB UNDERGLOW (WS2812)
# ============================================================

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Prevent RGB toggles/effect changes from also toggling external power
# (this can blank OLEDs depending on wiring/power gating)
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Battery-saving: turn off underglow when keyboard goes idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Startup defaults (supported by your repo’s existing conf style)
# 0=Solid, 1=Breathe, 2=Spectrum, 3=Swirl (if your ZMK build includes them)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=80
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3

# Optional tuning (leave commented unless you want it)
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=10
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=2

# ============================================================
# OLED DISPLAY
# ============================================================

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ============================================================
# Input / HID stability
# ============================================================

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# ============================================================
# Encoder support
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
